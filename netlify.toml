# Netlify configuration — Agent Hub (Vite + React SPA)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every route serves index.html so client-side
# rendering can take over (200, not a redirect).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
